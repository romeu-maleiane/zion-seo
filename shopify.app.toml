client_id = "db08c9d16e52101fd52ec34b8de1321b"
name = "ZionSEO"
handle = "zionseo"
application_url = "https://power-tee-firewall-occasionally.trycloudflare.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = ["https://power-tee-firewall-occasionally.trycloudflare.com/auth/callback", "https://power-tee-firewall-occasionally.trycloudflare.com/auth/shopify/callback", "https://power-tee-firewall-occasionally.trycloudflare.com/api/auth/callback"]

[pos]
embedded = false
